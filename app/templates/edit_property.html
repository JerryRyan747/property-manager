{% extends "base.html" %}

{% block content %}

<h1>Edit Property</h1>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">Property Name</label>

        <input

            class="form-control"

            type="text"

            name="name"

            value="{{ property.name }}"

            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Address</label>

        <input

            class="form-control"

            type="text"

            name="address"

            value="{{ property.address }}"

            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Purchase Price</label>

        <input

            class="form-control"

            type="number"

            step="0.01"

            name="purchase_price"

            value="{{ property.purchase_price }}"

            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Current Value</label>

        <input

            class="form-control"

            type="number"

            step="0.01"

            name="current_value"

            value="{{ property.current_value or '' }}">

    </div>

    <div class="mb-3">
    <label class="form-label">Annual Rent</label>
    <input
        class="form-control"
        type="number"
        step="0.01"
        name="annual_rent"
        value="{{ property.annual_rent or '' }}">
    </div>

    <div class="mb-3">
    <label class="form-label">Annual Expenses</label>
    <input type="number"
           step="0.01"
           class="form-control"
           name="annual_expenses"
           value="{{ property.annual_expenses or '' }}">
    </div>

    <div class="mb-3">

        <label class="form-label">Mortgage Balance</label>

        <input
            class="form-control"
            type="number"
            step="0.01"
            name="mortgage_balance"
            value="{{ property.mortgage_balance or '' }}">

    </div>

    <div class="mb-3">

        <label class="form-label">Interest Rate (%)</label>

        <input
            class="form-control"
            type="number"
            step="0.01"
            name="interest_rate"
            value="{{ property.interest_rate or '' }}">

    </div>

    <div class="mb-3">
        <label class="form-label">Mortgage Term (Years)</label>
        <input type="number"
            step="1"
            min="0"
            class="form-control"
            name="mortgage_term"
            value="{{ property.mortgage_term or '' }}">
    </div>

    <button type="submit" class="btn btn-success">

        Save Changes

    </button>

    <a href="{{ url_for('main.home') }}" class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
